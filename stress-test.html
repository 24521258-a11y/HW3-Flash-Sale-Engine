
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>HW3 - Inventory Stress Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      box-sizing: border-box;
      background: #0b1224;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 720px;
      margin: auto;
      padding: 35px;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #17243e;
    }

    h1 {
      color: #7dd3fc;
    }

    p {
      line-height: 1.6;
    }

    button {
      padding: 14px 25px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #fbbf24;
      outline-offset: 3px;
    }

    #test-result {
      margin-top: 28px;
      padding: 20px;
      border: 1px solid #475569;
      border-radius: 10px;
    }

    .pass {
      border-color: #4ade80 !important;
    }

    .fail {
      border-color: #fb7185 !important;
    }

    dt {
      display: inline-block;
      width: 160px;
      margin-bottom: 12px;
    }

    dd {
      display: inline-block;
      margin: 0;
      font-weight: bold;
    }

    dd::after {
      content: "";
      display: block;
    }

    a {
      color: #7dd3fc;
    }
  </style>
</head>

<body>
  <main>
    <h1>HW3 - Inventory Stress Test</h1>

    <p>
      Simulating 100 reservation requests against
      one product with only 5 available units.
    </p>

    <button id="run-test" type="button">
      Run 100 Reservation Requests
    </button>

    <section id="test-result" aria-live="polite">
      <p>Click the button to start testing.</p>
    </section>

    <p>
      <a href="/">Return to Flash Sale</a>
    </p>
  </main>

  <script type="module" src="/src/stressTestPage.ts"></script>
</body>
</html>
